[project]
name = "uk-cooking-appliance-datasets"
version = "1.0.0"
description = "Production-grade long-run UK cooking appliance market datasets with income and home-price segmentation"
authors = [{name = "Kitchen Demand Lab"}]
requires-python = ">=3.11"
dependencies = [
    "polars>=0.20.0",
    "pyarrow>=14.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--strict-markers --cov=models --cov-report=json --cov-report=term"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
